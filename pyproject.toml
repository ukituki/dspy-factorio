[project]
name = "factorio-gym"
version = "0.1.0"
description = "Local FLE scenarios and DSPy agent optimization for Factorio Learning Environment"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "a2a-sdk>=0.3.26,<1",
    "dspy>=3.3.0",
    "factorio-learning-environment[eval]>=0.4.3",
    "python-dotenv>=1.0.1",
]

[project.scripts]
factorio-gym = "main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["factorio_gym"]
