[project]
name = "dspy-factorio"
version = "0.1.0"
description = "Learn DSPy step by step by practicing with Factorio (FLE)"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "a2a-sdk>=0.3.26,<1",
    "dspy>=3.3.0",
    "factorio-learning-environment[eval]>=0.4.3",
    "python-dotenv>=1.0.1",
]

[project.scripts]
dspy-factorio = "main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["dspy_factorio"]
